# Cloud Build CI/CD Pipeline
# Triggers on push to main branch
#
# Steps:
#   1. Run unit tests for all services (parallel)
#   2. Build Docker images (parallel)
#   3. Push to Artifact Registry
#   4. Deploy to staging via Skaffold
#   5. Run smoke tests against staging
#   6. Promote to production (manual approval gate)
#
# DORA Metrics tracked: deployment frequency, lead time, change failure rate

steps:
  # ---- Step 1: Tests (parallel using fan-out) ----
  - id: "test-shared"
    name: "python:3.11-slim"
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install -e services/shared/ fakeredis pytest pytest-asyncio --quiet
        cd services/shared && python -m pytest tests/ -v --tb=short

  - id: "test-ingestion"
    name: "python:3.11-slim"
    entrypoint: bash
    waitFor: ["test-shared"]
    args:
      - "-c"
      - |
        pip install -e services/shared/ -e services/ingestion/[test] fakeredis --quiet
        cd services/ingestion && python -m pytest tests/ -v --tb=short --cov=src --cov-report=term

  - id: "test-ml"
    name: "python:3.11-slim"
    entrypoint: bash
    waitFor: ["test-shared"]
    args:
      - "-c"
      - |
        pip install -e services/shared/ -e services/ml-service/[test] --quiet
        cd services/ml-service && python -m pytest tests/ -v --tb=short

  - id: "test-sentiment"
    name: "python:3.11-slim"
    entrypoint: bash
    waitFor: ["test-shared"]
    args:
      - "-c"
      - |
        pip install -e services/shared/ -e services/sentiment/[test] --quiet
        cd services/sentiment && python -m pytest tests/ -v --tb=short

  - id: "test-frontend"
    name: "node:20-alpine"
    entrypoint: sh
    args:
      - "-c"
      - |
        cd frontend && npm ci && npm run type-check && npm run lint

  # ---- Step 2: Build images (parallel after tests pass) ----
  - id: "build-ingestion"
    name: "gcr.io/cloud-builders/docker"
    waitFor: ["test-ingestion"]
    args:
      - build
      - -t
      - "$_AR_HOSTNAME/$PROJECT_ID/financial/ingestion:$COMMIT_SHA"
      - -t
      - "$_AR_HOSTNAME/$PROJECT_ID/financial/ingestion:latest"
      - -f
      - services/ingestion/Dockerfile
      - .

  - id: "build-ml"
    name: "gcr.io/cloud-builders/docker"
    waitFor: ["test-ml"]
    args:
      - build
      - -t
      - "$_AR_HOSTNAME/$PROJECT_ID/financial/ml-service:$COMMIT_SHA"
      - -f
      - services/ml-service/Dockerfile
      - .

  - id: "build-sentiment"
    name: "gcr.io/cloud-builders/docker"
    waitFor: ["test-sentiment"]
    args:
      - build
      - -t
      - "$_AR_HOSTNAME/$PROJECT_ID/financial/sentiment:$COMMIT_SHA"
      - -f
      - services/sentiment/Dockerfile
      - .

  - id: "build-api-gateway"
    name: "gcr.io/cloud-builders/docker"
    waitFor: ["test-shared"]
    args:
      - build
      - -t
      - "$_AR_HOSTNAME/$PROJECT_ID/financial/api-gateway:$COMMIT_SHA"
      - -f
      - services/api-gateway/Dockerfile
      - .

  - id: "build-frontend"
    name: "gcr.io/cloud-builders/docker"
    waitFor: ["test-frontend"]
    args:
      - build
      - -t
      - "$_AR_HOSTNAME/$PROJECT_ID/financial/frontend:$COMMIT_SHA"
      - -f
      - frontend/Dockerfile
      - frontend/

  # ---- Step 3: Push all images ----
  - id: "push-images"
    name: "gcr.io/cloud-builders/docker"
    waitFor:
      - build-ingestion
      - build-ml
      - build-sentiment
      - build-api-gateway
      - build-frontend
    entrypoint: bash
    args:
      - "-c"
      - |
        docker push "$_AR_HOSTNAME/$PROJECT_ID/financial/ingestion:$COMMIT_SHA"
        docker push "$_AR_HOSTNAME/$PROJECT_ID/financial/ml-service:$COMMIT_SHA"
        docker push "$_AR_HOSTNAME/$PROJECT_ID/financial/sentiment:$COMMIT_SHA"
        docker push "$_AR_HOSTNAME/$PROJECT_ID/financial/api-gateway:$COMMIT_SHA"
        docker push "$_AR_HOSTNAME/$PROJECT_ID/financial/frontend:$COMMIT_SHA"

  # ---- Step 4: Deploy to staging via Skaffold ----
  - id: "deploy-staging"
    name: "gcr.io/k8s-skaffold/skaffold"
    waitFor: ["push-images"]
    args:
      - skaffold
      - deploy
      - --profile=staging
      - --tag=$COMMIT_SHA

  # ---- Step 5: Smoke tests against staging ----
  - id: "smoke-tests"
    name: "python:3.11-slim"
    waitFor: ["deploy-staging"]
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install httpx --quiet
        python scripts/smoke_test.py --env=staging

substitutions:
  _AR_HOSTNAME: us-central1-docker.pkg.dev

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: "1800s"
