apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: financial
  labels:
    app: ingestion
    component: data-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestion
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ingestion
        component: data-pipeline
      annotations:
        # Workload Identity — maps to GCP SA with Pub/Sub, Secret Manager permissions
        iam.gke.io/gcp-service-account: ingestion-sa@financial-prod.iam.gserviceaccount.com
    spec:
      serviceAccountName: ingestion-ksa
      terminationGracePeriodSeconds: 60
      containers:
        - name: ingestion
          image: gcr.io/financial-prod/ingestion:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8003
              protocol: TCP
          env:
            - name: ENV
              value: "prod"
            - name: GCP_PROJECT_ID
              value: "financial-prod"
            - name: PUBSUB_TOPIC_MARKET_EVENTS
              value: "market-events"
            - name: REDIS_HOST
              value: "redis-master.financial.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: POSTGRES_HOST
              value: "postgres.financial.svc.cluster.local"
            - name: POSTGRES_DB
              value: "financial_prod"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: ALPHA_VANTAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: alpha-vantage
            - name: METALPRICEAPI_KEY
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: metalpriceapi
            - name: METALS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: metals-api
            - name: MARKETSTACK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: marketstack
            - name: OPEN_EXCHANGE_RATES_APP_ID
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: open-exchange-rates
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [ingestion]
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
  namespace: financial
  labels:
    app: ingestion
spec:
  selector:
    app: ingestion
  ports:
    - name: http
      port: 8003
      targetPort: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingestion-hpa
  namespace: financial
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingestion
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
