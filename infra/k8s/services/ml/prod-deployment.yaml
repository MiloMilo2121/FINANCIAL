apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  namespace: financial
  labels:
    app: ml-service
    version: "0.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero-downtime deployments
  template:
    metadata:
      labels:
        app: ml-service
    spec:
      serviceAccountName: financial-ml
      containers:
        - name: ml-service
          image: financial/ml-service:latest
          ports:
            - containerPort: 8002
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "8Gi"  # LSTM inference needs significant memory
          env:
            - name: LOG_LEVEL
              value: "INFO"
            - name: PUBSUB_PROJECT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - secretRef:
                name: financial-ml-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8002
            initialDelaySeconds: 60  # Model loading takes time
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: financial
spec:
  selector:
    app: ml-service
  ports:
    - protocol: TCP
      port: 8002
      targetPort: 8002
  type: ClusterIP  # Internal only — accessed via api-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ml-service-hpa
  namespace: financial
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ml-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
