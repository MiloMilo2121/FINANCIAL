apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment
  namespace: financial
  labels:
    app: sentiment
    component: nlp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentiment
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sentiment
        component: nlp
      annotations:
        iam.gke.io/gcp-service-account: sentiment-sa@financial-prod.iam.gserviceaccount.com
    spec:
      serviceAccountName: sentiment-ksa
      terminationGracePeriodSeconds: 120  # Give NLP processing time to finish
      containers:
        - name: sentiment
          image: gcr.io/financial-prod/sentiment:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          env:
            - name: ENV
              value: "prod"
            - name: GCP_PROJECT_ID
              value: "financial-prod"
            - name: PUBSUB_SUBSCRIPTION_NEWS
              value: "sentiment-news-events"
            - name: PUBSUB_TOPIC_SENTIMENT
              value: "sentiment-events"
            - name: PERPLEXITY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: perplexity
            - name: PINECONE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: pinecone
            - name: REDIS_HOST
              value: "redis-master.financial.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [sentiment]
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: sentiment
  namespace: financial
  labels:
    app: sentiment
spec:
  selector:
    app: sentiment
  ports:
    - name: http
      port: 8002
      targetPort: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sentiment-hpa
  namespace: financial
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sentiment
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
