[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "financial-api-gateway"
version = "0.1.0"
description = "API Gateway for Financial Projection Platform"
requires-python = ">=3.11"
dependencies = [
    "financial-shared",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "httpx>=0.26",
    "redis[hiredis]>=5.0",
    "pyjwt>=2.8",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "websockets>=12.0",
    "structlog>=23.2",
]

[tool.setuptools.packages.find]
where = ["src"]
