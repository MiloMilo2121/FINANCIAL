[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "financial-ingestion"
version = "0.1.0"
description = "Data ingestion microservice for Financial Projection Platform"
requires-python = ">=3.11"
dependencies = [
    "financial-shared",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "httpx>=0.26",
    "redis[hiredis]>=5.0",
    "apscheduler>=3.10",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "tenacity>=8.2",
    "structlog>=23.2",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.21",
    "pytest-httpx>=0.28",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
