[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "financial-ml"
version = "0.1.0"
description = "ML inference service for Financial Projection Platform"
requires-python = ">=3.11"
dependencies = [
    "financial-shared",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "torch>=2.1",
    "xgboost>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "transformers>=4.37",
    "pinecone-client>=3.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pandas>=2.1",
    "structlog>=23.2",
    "tenacity>=8.2",
    "httpx>=0.26",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
